<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digimon Digivolution Graph</title>
    <meta name="description" content="Suivi simplifié de tes Digimon dans Digimon World Next Order.">
    <meta name="theme-color" content="#212529">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Digimon Digivolution Graph">
    <meta property="og:description" content="Suivi simplifié de tes Digimon dans Digimon World Next Order.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐉%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Digimon World: Next Order – Digivolution Tree</h1>
    <div id="completion">0%</div>
  </header>
  <div class="search">
    <input id="searchInput" type="text" placeholder="Search a Digimon (e.g. Greymon)" />
    <button id="searchBtn">Search</button>
  </div>
  <div class="filters">
    <label class="checkbox">
      <input type="checkbox" id="focusFilter" checked />
      <span>Show only relevant digivolution paths</span>
    </label>
  </div>
  <div id="autocomplete"></div>
  <div id="network">
    <svg id="links"></svg>
    <div id="graph"></div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
